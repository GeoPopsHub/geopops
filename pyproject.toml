[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "geopops"
version = "0.1.8"
description = "Geographically and demographically realistic synthetic populations for any US Census location"
readme = "README.md"
requires-python = ">=3.11"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE", "NOTICE"]
authors = [
  { name = "GeoPops development team" },
]
maintainers = [
  { name = "GeoPops development team" },
]
keywords = [
  "synthetic population",
  "agent-based modeling",
  "census",
  "demography",
  "epidemiology",
  "contact networks",
  "starsim",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Natural Language :: English",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
  "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
  "curl-cffi>=0.13.0",
  "geopandas>=0.14",
  "networkx>=3.0",
  # >=1.18 for Generator.multivariate_hypergeometric; >=1.17 for SeedSequence.spawn
  "numpy>=1.18",
  "openpyxl>=3.1",
  "pandas>=2.3.2",
  "pyarrow>=14.0.0",
  "python-dotenv>=1.0.0",
  "requests>=2.32.5",
  "sciris>=3.0",
  "scipy>=1.10",
  "shapely>=2.0",
  "starsim>=3.0.3",
  "urllib3>=2.5.0",
]

[project.urls]
Homepage = "https://github.com/GeoPopsHub/geopops"
Repository = "https://github.com/GeoPopsHub/geopops"
Issues = "https://github.com/GeoPopsHub/geopops/issues"
Changelog = "https://github.com/GeoPopsHub/geopops/blob/main/CHANGELOG.md"
Examples = "https://github.com/GeoPopsHub"

[project.optional-dependencies]
dev = [
  "ipykernel",
  "pytest>=7.0",
  "ruff>=0.6",
]

[tool.setuptools.packages.find]
where = ["src"]

# patterns are relative to the *package root* (src/geopops)
[tool.setuptools.package-data]
geopops = ["geocorr/*", "config.json", "py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "slow: end-to-end tests that need downloaded/processed data (deselect with '-m \"not slow\"')",
  "network: tests that hit external data providers",
]

[tool.ruff]
line-length = 140
target-version = "py311"
extend-exclude = ["*.ipynb", "build"]

[tool.ruff.lint]
select = ["E", "F", "W", "B", "UP"]
ignore = [
  "E501",  # line length is handled by the formatter, not enforced
  "E741",  # ambiguous variable names (l, I) are pervasive in the ported numeric code
]

[tool.ruff.lint.per-file-ignores]
"src/geopops/ipfn.py" = ["ALL"]  # vendored third-party code, kept close to upstream
